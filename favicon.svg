  <!-- round glasses -->
  <g fill="#fff" fill-opacity=".35" stroke="#121220" stroke-width="3">
    <circle cx="23" cy="40" r="8.5"/>
    <circle cx="41" cy="40" r="8.5"/>
  </g>
  <path d="M31 39 Q32 36.5 33 39" fill="none" stroke="#121220" stroke-width="2.6"/>
  <!-- smile -->
